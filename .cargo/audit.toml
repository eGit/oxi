# cargo-audit policy. Every ignore below is a finding with no upstream fix;
# re-check each one whenever dependencies are updated.

[advisories]
ignore = [
    # ttf-parser 0.25.1 is unmaintained (warning, not a known vulnerability).
    # It is pulled in only by the latest fontdb 0.23 release, used to enumerate
    # local UI fonts. Dependabot tracks Cargo weekly; remove this entry when
    # fontdb replaces ttf-parser or a maintained fork becomes viable.
    "RUSTSEC-2026-0192",
    # rsa: Marvin Attack timing sidechannel. Pulled in via russh, which pins
    # rsa =0.10.0-rc.x; no fixed rsa release exists. Exposure here is a
    # client-side SSH tunnel to a user-configured trusted host only.
    # Revisit when russh moves off the rsa release candidates.
    "RUSTSEC-2023-0071",
    # quick-xml 0.39 (fix requires >=0.41): DoS via crafted XML. Pulled in via
    # wayland-scanner, a build-time proc-macro (Linux-only) that parses only
    # the trusted Wayland protocol XML shipped in the crate; never sees
    # untrusted input. Revisit when wayland-scanner bumps quick-xml.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # bincode 1.x and yaml-rust are unmaintained (warnings, no known
    # vulnerability). Both come in through syntect 5.3 (latest), which uses them
    # only to load its own bundled syntax/theme dumps. Revisit when syntect
    # moves to maintained replacements.
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0320",
    # zvariant, zvariant_derive, zbus_names are unmaintained (warnings). Linux
    # accessibility (AT-SPI over D-Bus) via egui-winit -> accesskit_unix; no
    # newer accesskit release has moved off them yet. Revisit on egui bumps.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
